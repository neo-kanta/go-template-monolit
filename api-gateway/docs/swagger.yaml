basePath: /
definitions:
  handlers.CreateTransactionRequest:
    properties:
      amount:
        example: 1500.5
        type: number
      currency:
        example: THB
        type: string
      from_account:
        example: "1234567890"
        type: string
      memo:
        example: 'Payment for invoice #123'
        type: string
      to_account:
        example: "0987654321"
        type: string
    required:
    - amount
    - currency
    - from_account
    - to_account
    type: object
  handlers.ErrorResponse:
    properties:
      error:
        example: invalid credentials
        type: string
    type: object
  handlers.HealthResponse:
    properties:
      service:
        example: api-gateway
        type: string
      status:
        example: ok
        type: string
    type: object
  handlers.LoginRequest:
    properties:
      password:
        example: admin123
        type: string
      username:
        example: admin
        type: string
    required:
    - password
    - username
    type: object
  handlers.LoginResponse:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIs...
        type: string
      expires_in:
        example: 3600
        type: integer
      token_type:
        example: bearer
        type: string
    type: object
  handlers.MeResponse:
    properties:
      expires_at:
        example: "2026-02-12T12:00:00Z"
        type: string
      role:
        example: admin
        type: string
      sub:
        example: admin
        type: string
    type: object
  handlers.TransactionListResponse:
    properties:
      total:
        example: 1
        type: integer
      transactions:
        items:
          $ref: '#/definitions/handlers.TransactionResponse'
        type: array
    type: object
  handlers.TransactionResponse:
    properties:
      amount:
        example: 1500.5
        type: number
      created_at:
        example: "2026-02-12T11:00:00Z"
        type: string
      created_by:
        example: admin
        type: string
      currency:
        example: THB
        type: string
      from_account:
        example: "1234567890"
        type: string
      status:
        example: pending
        type: string
      to_account:
        example: "0987654321"
        type: string
      transaction_id:
        example: txn_abc123def456
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: POC API Gateway with JWT authentication. Calls FND service via gRPC.
  title: Transfer Agent API Gateway
  version: 0.1.0
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Validates credentials and returns a JWT access token
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Authenticate user
      tags:
      - auth
  /api/v1/auth/me:
    get:
      description: Returns the claims of the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MeResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Current user info
      tags:
      - auth
  /api/v1/fnd/transactions:
    get:
      description: Returns a list of fund transactions from FND gRPC service.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.TransactionListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List fund transactions
      tags:
      - transactions
    post:
      consumes:
      - application/json
      description: Submits a new fund transfer transaction via FND gRPC service.
      parameters:
      - description: Transaction details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateTransactionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.TransactionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create fund transaction
      tags:
      - transactions
  /api/v1/health:
    get:
      description: Returns service health status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.HealthResponse'
      summary: Health check
      tags:
      - system
securityDefinitions:
  BearerAuth:
    description: 'Enter your bearer token: **Bearer &lt;token&gt;**'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
