services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taplatformw
      POSTGRES_USER: taplatform
      POSTGRES_PASSWORD: taplatform
    ports:
      - "5436:5436"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taplatform -d taplatform"]
      interval: 5s
      timeout: 3s
      retries: 10

  fnd:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.fnd
    environment:
      - GRPC_ADDR=0.0.0.0:50051
      - DB_DSN=host=postgres user=taplatform password=taplatform dbname=taplatform port=5432 sslmode=disable TimeZone=Asia/Bangkok
      - LOG_LEVEL=info
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "50051:50051"
      - "8081:8081"

  gateway:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.gateway
    environment:
      - GIN_MODE=release
      - PORT=8080
      - JWT_SECRET=docker-compose-poc-secret
      - JWT_EXPIRY_MINUTES=60
      - FND_SERVICE_ADDR=fnd:50051
    depends_on:
      - fnd
    ports:
      - "8080:8080"
