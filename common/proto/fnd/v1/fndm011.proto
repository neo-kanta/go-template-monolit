syntax = "proto3";

package fnd.v1;
option go_package = "go-transfer-agent/common/gen/fnd/v1;fndv1";

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "fnd/v1/common.proto";

// ═══════════════════════════════════════════════════════════════════
// FNDM011 Service
// ═══════════════════════════════════════════════════════════════════
service FNDM011Service {
  rpc TAFNDIShareFundFeeRdm(TAFNDIShareFundFeeRdmRequest) returns (TAFNDIShareFundFeeRdmResponse) {
    option (google.api.http) = { get: "/TAapi/Fund/TAFNDIShareFundFeeRdm" };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: ["APIFNDM011：TAFNDIShareFundFeeRdm"]
    };
  }

  rpc SaveTAFNDIShareFundFeeRdm(TAFNDIShareFundFeeRdmRequest) returns (SaveResponse) {
    option (google.api.http) = { post: "/TAapi/Fund/TAFNDIShareFundFeeRdm" body: "*" };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: ["APIFNDM011：TAFNDIShareFundFeeRdm"]
    };
  }

  rpc UpdateTAFNDIShareFundFeeRdm(TAFNDIShareFundFeeRdmRequest) returns (SaveResponse) {
    option (google.api.http) = { put: "/TAapi/Fund/TAFNDIShareFundFeeRdm" body: "*" };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: ["APIFNDM011：TAFNDIShareFundFeeRdm"]
    };
  }

  rpc DeleteTAFNDIShareFundFeeRdm(DeleteRequest) returns (SaveResponse) {
    option (google.api.http) = { delete: "/TAapi/Fund/TAFNDIShareFundFeeRdm" };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: ["APIFNDM011：TAFNDIShareFundFeeRdm"]
    };
  }


  // GET Data by DataID (Maintain Query)
  rpc GetDataByDataID(GetDataRequest) returns (TAFNDIShareFundFeeRdmRequest) {
    option (google.api.http) = { get: "/TAapi/Fund/TAFNDIShareFundFeeRdm/GetData/{data_id}" };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: ["APIFNDM011：TAFNDIShareFundFeeRdm"]
    };
  }

}
// ═══════════════════════════════════════════════════════════════════
// FNDM011 Messages
// ═══════════════════════════════════════════════════════════════════

message TAFNDIShareFundFeeRdmRequest {
  string sys_co_id = 1 [json_name="SysCoID"];
  string fund_code = 2 [json_name="FundCode"];
  string fee_name = 3 [json_name="FeeName"];
  string rdm_range_type = 4 [json_name="RdmRangeType"];
  string rdm_date_type = 5 [json_name="RdmDateType"];
  string rdm_base_id = 6 [json_name="RdmBaseID"];
  string subs_base_id = 7 [json_name="SubsBaseID"];
  string rdm_calc_id = 8 [json_name="RdmCalcID"];
  int32 should_hold_days = 9 [json_name="ShouldHoldDays"];
  double fee_rate = 10 [json_name="FeeRate"];
}

message TAFNDIShareFundFeeRdmResponse {
  repeated IShareFundFeeRdmMasterDTO result_list = 1 [json_name="ResultList"];
}

message IShareFundFeeRdmMasterDTO {
  string sys_co_id = 1 [json_name="SysCoID"];
  string sys_co_id_nm = 2 [json_name="SysCoIDNm"];
  string fund_code = 3 [json_name="FundCode"];
  string fund_code_nm = 4 [json_name="FundCodeNm"];
  string fee_name = 5 [json_name="FeeName"];
  string rdm_range_type = 6 [json_name="RdmRangeType"];
  string rdm_date_type = 7 [json_name="RdmDateType"];
  string rdm_base_id = 8 [json_name="RdmBaseID"];
  string subs_base_id = 9 [json_name="SubsBaseID"];
  string rdm_calc_id = 10 [json_name="RdmCalcID"];
  int32 should_hold_days = 11 [json_name="ShouldHoldDays"];
  double fee_rate = 12 [json_name="FeeRate"];
}

message ApproveTAFNDIShareFundFeeRdmRequest {
  string sys_co_id = 1 [json_name="SysCoID"];
  string data_id = 2 [json_name="DataID"];
  string checker_id = 3 [json_name="CheckerID"];
  bool is_approved = 4 [json_name="IsApproved"];
  string remark = 5 [json_name="Remark"];
}
