syntax = "proto3";

package fnd.v1;
option go_package = "go-transfer-agent/common/gen/fnd/v1;fndv1";

// ═══════════════════════════════════════════════════════════════════
// Shared Messages
// ═══════════════════════════════════════════════════════════════════

// SaveResponse is the standard response for POST/PUT save operations.
message SaveResponse {
  bool success = 1 [json_name="Success"];
  string message = 2 [json_name="Message"];
  string return_code = 3 [json_name="ReturnCode"];
}

// CheckResponse is the standard response for check (ChkData) operations.
message CheckResponse {
  string return_code = 1 [json_name="ReturnCode"];
  string message = 2 [json_name="Message"];
}

// DeleteRequest is the standard request for DELETE operations.
message DeleteRequest {
  string data_id = 1 [json_name="DataID"];
  string data_flag = 2 [json_name="DataFlag"];
}

// GetDataRequest is used to fetch a single record by its unapproved/approved GUID.
message GetDataRequest {
  string data_id = 1 [json_name="DataID"];
}
