syntax = "proto3";

package fnd.v1;
option go_package = "go-transfer-agent/common/gen/fnd/v1;fndv1";

import "google/api/annotations.proto";

// ═══════════════════════════════════════════════════════════════════
// FNDM006 Service
// ═══════════════════════════════════════════════════════════════════
service FNDM006Service {
  rpc TAFNDRPFeeChgType(TAFNDRPFeeChgTypeRequest) returns (TAFNDRPFeeChgTypeResponse) {
    option (google.api.http) = { get: "/TAapi/Fund/TAFNDRPFeeChgType" };
  }
}

// ═══════════════════════════════════════════════════════════════════
// FNDM006 Messages
// ═══════════════════════════════════════════════════════════════════

message TAFNDRPFeeChgTypeRequest {
  string sys_co_id = 1 [json_name="SysCoID"];
  string pmt_txn_type = 2 [json_name="PmtTxnType"];
  string prt_fund_code = 3 [json_name="PrtFundCode"];
  repeated ChgTypeListDTO chg_type_list = 4 [json_name="ChgTypeList"];
}

message TAFNDRPFeeChgTypeResponse {
  repeated RPFeeChgTypeMasterDTO result_list = 1 [json_name="ResultList"];
  repeated ChgTypeListDTO chg_type_list = 2 [json_name="ChgTypeList"];
}

message RPFeeChgTypeMasterDTO {
  string sys_co_id = 1 [json_name="SysCoID"];
  string sys_co_id_nm = 2 [json_name="SysCoIDNm"];
  string pmt_txn_type = 3 [json_name="PmtTxnType"];
  string prt_fund_code = 4 [json_name="PrtFundCode"];
  string prt_fund_code_nm = 5 [json_name="PrtFundCodeNm"];
}

message ChgTypeListDTO {
  string sys_co_id = 1 [json_name="SysCoID"];
  string pmt_txn_type = 2 [json_name="PmtTxnType"];
  string prt_fund_code = 3 [json_name="PrtFundCode"];
  string cry_kind = 4 [json_name="CryKind"];
  string remit_fee_obj = 5 [json_name="RemitFeeObj"];
  string remit_fee_chg_type = 6 [json_name="RemitFeeChgType"];
  string post_fee_obj = 7 [json_name="PostFeeObj"];
}
