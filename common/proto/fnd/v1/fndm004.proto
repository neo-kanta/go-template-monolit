syntax = "proto3";

package fnd.v1;
option go_package = "go-transfer-agent/common/gen/fnd/v1;fndv1";

import "google/api/annotations.proto";

// ═══════════════════════════════════════════════════════════════════
// FNDM004 Service
// ═══════════════════════════════════════════════════════════════════
service FNDM004Service {
  rpc TAFNDFundAgent(TAFNDFundAgentRequest) returns (TAFNDFundAgentResponse) {
    option (google.api.http) = { get: "/TAapi/BaseFund/TAFNDFundAgent" };
  }
}

// ═══════════════════════════════════════════════════════════════════
// FNDM004 Messages
// ═══════════════════════════════════════════════════════════════════

message TAFNDFundAgentRequest {
  string sys_co_id = 1 [json_name="SysCoID"];
  string prt_fund_code = 2 [json_name="PrtFundCode"];
  repeated FundAgentDtlListDTO fund_agent_dtl_list = 3 [json_name="FundAgentDtlList"];
}

message TAFNDFundAgentResponse {
  repeated FundAgentMasterDTO result_list = 1 [json_name="ResultList"];
  repeated FundAgentDtlListDTO fund_agent_dtl_list = 2 [json_name="FundAgentDtlList"];
}

message FundAgentMasterDTO {
  string sys_co_id = 1 [json_name="SysCoID"];
  string sys_co_id_nm = 2 [json_name="SysCoIDNm"];
  string prt_fund_code = 3 [json_name="PrtFundCode"];
  string prt_fund_code_nm = 4 [json_name="PrtFundCodeNm"];
  string fund_ipo_date = 5 [json_name="FundIpoDate"];
}

message FundAgentDtlListDTO {
  string sys_co_id = 1 [json_name="SysCoID"];
  string prt_fund_code = 2 [json_name="PrtFundCode"];
  string agent_type = 3 [json_name="AgentType"];
  string agent_code = 4 [json_name="AgentCode"];
  string agent_code_nm = 5 [json_name="AgentCodeNm"];
  bool is_m_agent_op_type = 6 [json_name="IsMAgentOPType"];
  string agent_op_type = 7 [json_name="AgentOPType"];
  bool is_m_rcv_txn_type = 8 [json_name="IsMRcvTxnType"];
  string rcv_txn_type = 9 [json_name="RcvTxnType"];
  bool is_m_subs_fee_pct = 10 [json_name="IsMSubsFeePct"];
  double subs_fee_pct_ag = 11 [json_name="SubsFeePctAG"];
  double subs_fee_pct_fh = 12 [json_name="SubsFeePctFH"];
  bool is_m_subs_fee_pct_type = 13 [json_name="IsMSubsFeePctType"];
  string subs_fee_pct_type = 14 [json_name="SubsFeePctType"];
  bool is_m_fund_cry_set = 15 [json_name="IsMFundCrySet"];
  repeated string fund_cry_set = 16 [json_name="FundCrySet"];
  repeated string fund_cry_set_nm = 17 [json_name="FundCrySetNm"];
  repeated string no_sale_share_set = 18 [json_name="NoSaleShareSet"];
  repeated string no_sale_share_set_nm = 19 [json_name="NoSaleShareSetNm"];
  bool is_m_end_of_sale = 20 [json_name="IsMEndOfSale"];
  string term_date = 21 [json_name="TermDate"];
}
