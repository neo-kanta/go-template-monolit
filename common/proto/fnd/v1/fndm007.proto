syntax = "proto3";

package fnd.v1;
option go_package = "go-transfer-agent/common/gen/fnd/v1;fndv1";

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "fnd/v1/common.proto";

// ═══════════════════════════════════════════════════════════════════
// FNDM007 Service
// ═══════════════════════════════════════════════════════════════════
service FNDM007Service {
  rpc TAFNDCustGroup(TAFNDCustGroupRequest) returns (TAFNDCustGroupResponse) {
    option (google.api.http) = { get: "/TAapi/Fund/TAFNDCustGroup" };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: ["APIFNDM007：TAFNDFundGroup"]
    };
  }

  rpc SaveTAFNDCustGroup(TAFNDCustGroupRequest) returns (SaveResponse) {
    option (google.api.http) = { post: "/TAapi/Fund/TAFNDCustGroup" body: "*" };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: ["APIFNDM007：TAFNDFundGroup"]
    };
  }

  rpc UpdateTAFNDCustGroup(TAFNDCustGroupRequest) returns (SaveResponse) {
    option (google.api.http) = { put: "/TAapi/Fund/TAFNDCustGroup" body: "*" };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: ["APIFNDM007：TAFNDFundGroup"]
    };
  }

  rpc DeleteTAFNDCustGroup(DeleteRequest) returns (SaveResponse) {
    option (google.api.http) = { delete: "/TAapi/Fund/TAFNDCustGroup" };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: ["APIFNDM007：TAFNDFundGroup"]
    };
  }

  rpc TAGetCustGroup(TAGetCustGroupRequest) returns (TAGetCustGroupResponse) {
    option (google.api.http) = { get: "/TAapi/BaseFund/TAFNDCustGroup/GetInfo/TAGetCustGroup" };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: ["APIFNDM007：TAFNDFundGroup"]
    };
  }


  // GET Data by DataID (Maintain Query)
  rpc GetDataByDataID(GetDataRequest) returns (TAFNDCustGroupRequest) {
    option (google.api.http) = { get: "/TAapi/BaseFund/TAFNDCustGroup/GetData/{data_id}" };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: ["APIFNDM007：TAFNDFundGroup"]
    };
  }

}
// ═══════════════════════════════════════════════════════════════════
// FNDM007 Messages
// ═══════════════════════════════════════════════════════════════════

message TAFNDCustGroupRequest {
  string sys_co_id = 1 [json_name="SysCoID"];
  string cust_grp_code = 2 [json_name="CustGrpCode"];
  string cust_grp_m_name = 3 [json_name="CustGrpMName"];
  string cust_grp_s_name = 4 [json_name="CustGrpSName"];
  repeated CustFundGroupListDTO cust_fund_group_list = 5 [json_name="CustFundGroupList"];
}

message TAFNDCustGroupResponse {
  repeated CustGroupMasterDTO result_list = 1 [json_name="ResultList"];
  repeated CustFundGroupListDTO cust_fund_group_list = 2 [json_name="CustFundGroupList"];
}

message CustGroupMasterDTO {
  string sys_co_id = 1 [json_name="SysCoID"];
  string sys_co_id_nm = 2 [json_name="SysCoIDNm"];
  string cust_grp_code = 3 [json_name="CustGrpCode"];
  string cust_grp_m_name = 4 [json_name="CustGrpMName"];
  string cust_grp_s_name = 5 [json_name="CustGrpSName"];
}

message CustFundGroupListDTO {
  string sys_co_id = 1 [json_name="SysCoID"];
  string cust_grp_code = 2 [json_name="CustGrpCode"];
  string prt_fund_code = 3 [json_name="PrtFundCode"];
  string prt_fund_code_nm = 4 [json_name="PrtFundCodeNm"];
}

// GFNDM00701
message TAGetCustGroupRequest {
  string sys_co_id = 1 [json_name="SysCoID"];
  string cust_grp_code = 2 [json_name="CustGrpCode"];
}

message TAGetCustGroupResponse {
  repeated CustGroupLookupDTO master = 1 [json_name="Master"];
}

message CustGroupLookupDTO {
  string cust_grp_code = 1 [json_name="CustGrpCode"];
  string cust_grp_code_nm = 2 [json_name="CustGrpCodeNM"];
}

message ApproveTAFNDCustGroupRequest {
  string sys_co_id = 1 [json_name="SysCoID"];
  string data_id = 2 [json_name="DataID"];
  string checker_id = 3 [json_name="CheckerID"];
  bool is_approved = 4 [json_name="IsApproved"];
  string remark = 5 [json_name="Remark"];
}
