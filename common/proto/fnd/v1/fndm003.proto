syntax = "proto3";

package fnd.v1;
option go_package = "go-transfer-agent/common/gen/fnd/v1;fndv1";

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "fnd/v1/common.proto";

// ═══════════════════════════════════════════════════════════════════
// FNDM003 Service
// ═══════════════════════════════════════════════════════════════════
service FNDM003Service {
  rpc TAFNDSwitch(TAFNDSwitchRequest) returns (TAFNDSwitchResponse) {
    option (google.api.http) = { get: "/TAapi/Fund/TAFNDSwitch" };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: ["APIFNDM003：TAFNDSwitch"]
    };
  }

  rpc SaveTAFNDSwitch(TAFNDSwitchRequest) returns (SaveResponse) {
    option (google.api.http) = { post: "/TAapi/Fund/TAFNDSwitch" body: "*" };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: ["APIFNDM003：TAFNDSwitch"]
    };
  }

  rpc UpdateTAFNDSwitch(TAFNDSwitchRequest) returns (SaveResponse) {
    option (google.api.http) = { put: "/TAapi/Fund/TAFNDSwitch" body: "*" };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: ["APIFNDM003：TAFNDSwitch"]
    };
  }

  rpc DeleteTAFNDSwitch(DeleteRequest) returns (SaveResponse) {
    option (google.api.http) = { delete: "/TAapi/Fund/TAFNDSwitch" };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: ["APIFNDM003：TAFNDSwitch"]
    };
  }


  // GET Data by DataID (Maintain Query)
  rpc GetDataByDataID(GetDataRequest) returns (TAFNDSwitchRequest) {
    option (google.api.http) = { get: "/TAapi/Fund/TAFNDSwitch/GetData/{data_id}" };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: ["APIFNDM003：TAFNDSwitch"]
    };
  }

}
// ═══════════════════════════════════════════════════════════════════
// FNDM003 Messages
// ═══════════════════════════════════════════════════════════════════

message TAFNDSwitchRequest {
  string sys_co_id = 1 [json_name="SysCoID"];
  string prt_fund_code = 2 [json_name="PrtFundCode"];
  string is_switch_in = 3 [json_name="IsSwitchIn"];
  repeated SwitchFundListDTO switch_fund_list = 4 [json_name="SwitchFundList"];
  repeated FundSwitchFeeListDTO fund_switch_fee_list = 5 [json_name="FundSwitchFeeList"];
  repeated SwitchCryListDTO switch_cry_list = 6 [json_name="SwitchCryList"];
}

message TAFNDSwitchResponse {
  repeated SwitchMasterDTO result_list = 1 [json_name="ResultList"];
  repeated SwitchFundListDTO switch_fund_list = 2 [json_name="SwitchFundList"];
  repeated FundSwitchFeeListDTO fund_switch_fee_list = 3 [json_name="FundSwitchFeeList"];
  repeated SwitchCryListDTO switch_cry_list = 4 [json_name="SwitchCryList"];
}

message SwitchMasterDTO {
  string sys_co_id = 1 [json_name="SysCoID"];
  string sys_co_id_nm = 2 [json_name="SysCoIDNm"];
  string prt_fund_code = 3 [json_name="PrtFundCode"];
  string prt_fund_code_nm = 4 [json_name="PrtFundCodeNm"];
  string is_switch_in = 5 [json_name="IsSwitchIn"];
}

message SwitchFundListDTO {
  string sys_co_id = 1 [json_name="SysCoID"];
  string prt_fund_code = 2 [json_name="PrtFundCode"];
  string sw_o_prt_fund_code = 3 [json_name="SwOPrtFundCode"];
  string sw_o_prt_fund_code_nm = 4 [json_name="SwOPrtFundCodeNm"];
  string sw_date_type = 5 [json_name="SwDateType"];
}

message FundSwitchFeeListDTO {
  string sys_co_id = 1 [json_name="SysCoID"];
  string prt_fund_code = 2 [json_name="PrtFundCode"];
  string fund_code = 3 [json_name="FundCode"];
  string sw_fund_type = 4 [json_name="SwFundType"];
  string sw_disc_type = 5 [json_name="SwDiscType"];
  double switch_rate = 6 [json_name="SwitchRate"];
}

message SwitchCryListDTO {
  string sys_co_id = 1 [json_name="SysCoID"];
  string prt_fund_code = 2 [json_name="PrtFundCode"];
  string sw_i_fund_cry = 3 [json_name="SwIFundCry"];
  string sw_i_fund_cry_nm = 4 [json_name="SwIFundCryNm"];
  string sw_o_fund_cry_set = 5 [json_name="SwOFundCrySet"];
  repeated string sw_o_fund_cry_set_nm = 6 [json_name="SwOFundCrySetNm"];
}

message ApproveTAFNDSwitchRequest {
  string sys_co_id = 1 [json_name="SysCoID"];
  string data_id = 2 [json_name="DataID"];
  string checker_id = 3 [json_name="CheckerID"];
  bool is_approved = 4 [json_name="IsApproved"];
  string remark = 5 [json_name="Remark"];
}
