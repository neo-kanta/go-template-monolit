syntax = "proto3";

package fnd.v1;
option go_package = "go-transfer-agent/common/gen/fnd/v1;fndv1";

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "fnd/v1/common.proto";

// ═══════════════════════════════════════════════════════════════════
// FNDM010 Service
// ═══════════════════════════════════════════════════════════════════
service FNDM010Service {
  rpc TAFNDIShareFundFee(TAFNDIShareFundFeeRequest) returns (TAFNDIShareFundFeeResponse) {
    option (google.api.http) = { get: "/TAapi/Fund/TAFNDIShareFundFee" };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: ["APIFNDM010：TAFNDIShareFundFee"]
    };
  }

  rpc SaveTAFNDIShareFundFee(TAFNDIShareFundFeeRequest) returns (SaveResponse) {
    option (google.api.http) = { post: "/TAapi/Fund/TAFNDIShareFundFee" body: "*" };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: ["APIFNDM010：TAFNDIShareFundFee"]
    };
  }

  rpc UpdateTAFNDIShareFundFee(TAFNDIShareFundFeeRequest) returns (SaveResponse) {
    option (google.api.http) = { put: "/TAapi/Fund/TAFNDIShareFundFee" body: "*" };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: ["APIFNDM010：TAFNDIShareFundFee"]
    };
  }

  rpc DeleteTAFNDIShareFundFee(DeleteRequest) returns (SaveResponse) {
    option (google.api.http) = { delete: "/TAapi/Fund/TAFNDIShareFundFee" };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: ["APIFNDM010：TAFNDIShareFundFee"]
    };
  }


  // GET Data by DataID (Maintain Query)
  rpc GetDataByDataID(GetDataRequest) returns (TAFNDIShareFundFeeRequest) {
    option (google.api.http) = { get: "/TAapi/Fund/TAFNDIShareFundFee/GetData/{data_id}" };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: ["APIFNDM010：TAFNDIShareFundFee"]
    };
  }

}
// ═══════════════════════════════════════════════════════════════════
// FNDM010 Messages
// ═══════════════════════════════════════════════════════════════════

message TAFNDIShareFundFeeRequest {
  string sys_co_id = 1 [json_name="SysCoID"];
  string fund_code = 2 [json_name="FundCode"];
  repeated IShareFundFeeListDTO i_share_fund_fee_list = 3 [json_name="IShareFundFeeList"];
}

message TAFNDIShareFundFeeResponse {
  repeated IShareFundFeeMasterDTO result_list = 1 [json_name="ResultList"];
  repeated IShareFundFeeListDTO i_share_fund_fee_list = 2 [json_name="IShareFundFeeList"];
}

message IShareFundFeeMasterDTO {
  string sys_co_id = 1 [json_name="SysCoID"];
  string sys_co_id_nm = 2 [json_name="SysCoIDNm"];
  string fund_code = 3 [json_name="FundCode"];
  string fund_code_nm = 4 [json_name="FundCodeNm"];
}

message IShareFundFeeListDTO {
  string sys_co_id = 1 [json_name="SysCoID"];
  string fund_code = 2 [json_name="FundCode"];
  double range_amt_above = 3 [json_name="RangeAmtAbove"];
  double subs_fee_rate = 4 [json_name="SubsFeeRate"];
}

message ApproveTAFNDIShareFundFeeRequest {
  string sys_co_id = 1 [json_name="SysCoID"];
  string data_id = 2 [json_name="DataID"];
  string checker_id = 3 [json_name="CheckerID"];
  bool is_approved = 4 [json_name="IsApproved"];
  string remark = 5 [json_name="Remark"];
}
