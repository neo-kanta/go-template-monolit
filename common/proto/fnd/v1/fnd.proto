// ─── Shared ───

message CheckResponse {
  string return_code = 1 [json_name="ReturnCode"];
  string message = 2 [json_name="Message"];
}

// ─── KFNDM Messages ───

// KFNDM00101
message TACKCSDPrtFundSetlDateRequest {
  string sys_co_id = 1 [json_name="SysCoID"];
  string csd_prt_fund_setl_date = 2 [json_name="CsdPrtFundSetlDate"];
  optional string fund_code = 3 [json_name="FundCode"];
}

// KFNDM00103
message TACKFundCodeExistRequest {
  string sys_co_id = 1 [json_name="SysCoID"];
  string fund_code = 2 [json_name="FundCode"];
}

// ─── GFNDM Messages ───

// GFNDM00101
message TAGetDPrtFundIssueCryRequest {
  string sys_co_id = 1 [json_name="SysCoID"];
  bool is_all = 2 [json_name="IsAll"];
  string prt_fund_code = 3 [json_name="PrtFundCode"];
  string fee_charge_type = 4 [json_name="FeeChargeType"];
  string filter_item = 5 [json_name="FilterItem"];
  string query_type = 6 [json_name="QueryType"];
}

message TAGetDPrtFundIssueCryResponse {
  repeated IssueCurrencyDTO master = 1 [json_name="Master"];
}

message IssueCurrencyDTO {
  string cry_id = 1 [json_name="CryID"];
  string cry_name = 2 [json_name="CryName"];
  string is_rsp = 3 [json_name="IsRsp"];
}

// GFNDM00104
message TAGetDTxCryRequest {
  string sys_co_id = 1 [json_name="SysCoID"];
  bool is_all = 2 [json_name="IsAll"];
  string prt_fund_code = 3 [json_name="PrtFundCode"];
  string cry_id = 4 [json_name="CryID"];
  string cry_data_src = 5 [json_name="CryDataSrc"];
  bool is_exclude_ccy = 6 [json_name="IsExcludeCcy"];
  string query_type = 7 [json_name="QueryType"];
}

message TAGetDTxCryResponse {
  repeated TransactionCurrencyDTO master = 1 [json_name="Master"];
}

message TransactionCurrencyDTO {
  string cry_id = 1 [json_name="CryID"];
  string cry_name = 2 [json_name="CryName"];
  int32 dec_len = 3 [json_name="DecLen"];
  string is_mcy = 4 [json_name="IsMcy"];
}

// ═══════════════════════════════════════════════════════════════════
// Existing POC Messages (Kept for compatibility)
// ═══════════════════════════════════════════════════════════════════

message CreateTransactionRequest {
  string from_account = 1 [json_name="FromAccount"];
  string to_account = 2 [json_name="ToAccount"];
  int64 amount_minor = 3 [json_name="AmountMinor"];
  string currency = 4 [json_name="Currency"];
  string memo = 5 [json_name="Memo"];
  string created_by = 6 [json_name="CreatedBy"];
}

message CreateTransactionResponse {
  string transaction_id = 1 [json_name="TransactionID"];
  string status = 2 [json_name="Status"];
  string created_at = 3 [json_name="CreatedAt"];
}

message ListTransactionsRequest {
  int32 page_size = 1 [json_name="PageSize"];
  string page_token = 2 [json_name="PageToken"];
}

message ListTransactionsResponse {
  repeated Transaction transactions = 1 [json_name="Transactions"];
  int32 total = 2 [json_name="Total"];
}

message Transaction {
  string transaction_id = 1 [json_name="TransactionID"];
  string from_account = 2 [json_name="FromAccount"];
  string to_account = 3 [json_name="ToAccount"];
  int64 amount_minor = 4 [json_name="AmountMinor"];
  string currency = 5 [json_name="Currency"];
  string memo = 6 [json_name="Memo"];
  string status = 7 [json_name="Status"];
  string created_by = 8 [json_name="CreatedBy"];
  string created_at = 9 [json_name="CreatedAt"];
}
