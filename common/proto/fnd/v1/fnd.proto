syntax = "proto3";

package fnd.v1;

import "google/api/annotations.proto";

option go_package = "go-transfer-agent/common/gen/fnd/v1;fndv1";

// FNDService is the gRPC service for fund transfer operations and FND spec functions.
service FNDService {
  // Existing POC methods
  rpc CreateTransaction(CreateTransactionRequest) returns (CreateTransactionResponse) {
    option (google.api.http) = { post: "/api/v1/transactions" body: "*" };
  }
  rpc ListTransactions(ListTransactionsRequest) returns (ListTransactionsResponse) {
    option (google.api.http) = { get: "/api/v1/transactions" };
  }

  // ─── APIFNDM001: TAFNDFundInfo ───

  // APIFNDM001Get: 一般查詢 — returns list of TAFNDFundInfoDTO
  rpc QueryFundInfo(QueryFundInfoRequest) returns (QueryFundInfoResponse) {
    option (google.api.http) = { get: "/TAapi/Fund/TAFNDFundInfo/GetData" };
  }

  // APIFNDM001GetMaintain: Maintain查詢 — returns full AUDResponse
  rpc QueryFundInfoByDataID(QueryFundInfoByDataIDRequest) returns (QueryFundInfoByDataIDResponse) {
    option (google.api.http) = { get: "/TAapi/Fund/TAFNDFundInfo/GetData/{prt_fund_code}" };
  }

  // APIFNDM001Post/Put: Save (Add or Modify)
  rpc SaveFundInfo(SaveFundInfoRequest) returns (SaveFundInfoResponse) {
    option (google.api.http) = { post: "/TAapi/Fund/TAFNDFundInfo" body: "*" };
  }

  // ─── KFNDM: Check Functions ───

  // KFNDM00101: ChkData/TACKCSDPrtFundSetlDate
  rpc TACKCSDPrtFundSetlDate(TACKCSDPrtFundSetlDateRequest) returns (CheckResponse) {
    option (google.api.http) = { get: "/TAapi/Fund/TAFNDFundInfo/ChkData/TACKCSDPrtFundSetlDate" };
  }

  // KFNDM00103: ChkData/TACKFundCodeExist
  rpc TACKFundCodeExist(TACKFundCodeExistRequest) returns (CheckResponse) {
    option (google.api.http) = { get: "/TAapi/Fund/TAFNDFundInfo/ChkData/TACKFundCodeExist" };
  }

  // ─── GFNDM: Get/Search Functions ───

  // GFNDM00101: GetInfo/TAGetDPrtFundIssueCry
  rpc TAGetDPrtFundIssueCry(TAGetDPrtFundIssueCryRequest) returns (TAGetDPrtFundIssueCryResponse) {
    option (google.api.http) = { get: "/TAapi/Fund/TAFNDFundInfo/GetInfo/TAGetDPrtFundIssueCry" };
  }

  // GFNDM00104: GetInfo/TAGetDTxCry
  rpc TAGetDTxCry(TAGetDTxCryRequest) returns (TAGetDTxCryResponse) {
    option (google.api.http) = { get: "/TAapi/Fund/TAFNDFundInfo/GetInfo/TAGetDTxCry" };
  }
}

// ═══════════════════════════════════════════════════════════════════
// APIFNDM001 Messages
// ═══════════════════════════════════════════════════════════════════

// ─── Query (APIFNDM001Get) ───

message QueryFundInfoRequest {
  string sys_co_id = 1 [json_name="SysCoID"];
}

message QueryFundInfoResponse {
  repeated TAFNDFundInfoDTO result_list = 1 [json_name="ResultList"];
}

// ─── Query By DataID (APIFNDM001GetMaintain) ───

message QueryFundInfoByDataIDRequest {
  string sys_co_id = 1 [json_name="SysCoID"];
  string prt_fund_code = 2 [json_name="PrtFundCode"];
}

message QueryFundInfoByDataIDResponse {
  TAFNDFundInfo master = 1 [json_name="Master"];
  DTAFNDFundInfo fund_info = 2 [json_name="FundInfo"];
  repeated DTAFNDFundCustContact cust_contacts = 3 [json_name="CustContacts"];
  DTAFNDFundSpecial special = 4 [json_name="Special"];
  repeated DTAFNDFundCryGroup cry_groups = 5 [json_name="CryGroups"];
  repeated DTAFNDFundDetail fund_details = 6 [json_name="FundDetails"];
  repeated DTAFNDFundAccount fund_accounts = 7 [json_name="FundAccounts"];
  repeated DTAFNDFundRelGroup fund_rel_groups = 8 [json_name="FundRelGroups"];
  repeated DTAFNDFundDisclosureFee fund_dis_fees = 9 [json_name="FundDisFees"];
  repeated DTAFNDFundTxCry fund_tx_crys = 10 [json_name="FundTxCrys"];
  repeated DTAFNDFundShortInf short_infs = 11 [json_name="ShortInfs"];
  repeated DTAFNDFundShortDtl short_dtls = 12 [json_name="ShortDtls"];
  repeated DTAFNDFundAntiDilution anti_dils = 13 [json_name="AntiDils"];
  repeated DTAFNDFundAntiDilMech anti_dil_mechs = 14 [json_name="AntiDilMechs"];  // output only: AntiDilSetType='1'
  repeated DTAFNDFundAntiDilAdj anti_dil_adjs = 15 [json_name="AntiDilAdjs"];  // output only: AntiDilSetType!='1'
  repeated DTAFNDFundMGTFeeInf mgt_fees = 16 [json_name="MgtFees"];
  repeated DTAFNDFundMGTFeeDtl mgt_fee_dtls = 17 [json_name="MgtFeeDtls"];
}

// ─── Save (APIFNDM001Post/Put) ───

message SaveFundInfoRequest {
  TAFNDFundInfo master = 1 [json_name="Master"];
  DTAFNDFundInfo fund_info = 2 [json_name="FundInfo"];
  repeated DTAFNDFundCustContact cust_contacts = 3 [json_name="CustContacts"];
  DTAFNDFundSpecial special = 4 [json_name="Special"];
  repeated DTAFNDFundCryGroup cry_groups = 5 [json_name="CryGroups"];
  repeated DTAFNDFundDetail fund_details = 6 [json_name="FundDetails"];
  repeated DTAFNDFundAccount fund_accounts = 7 [json_name="FundAccounts"];
  repeated DTAFNDFundRelGroup fund_rel_groups = 8 [json_name="FundRelGroups"];
  repeated DTAFNDFundDisclosureFee fund_dis_fees = 9 [json_name="FundDisFees"];
  repeated DTAFNDFundTxCry fund_tx_crys = 10 [json_name="FundTxCrys"];
  repeated DTAFNDFundShortInf short_infs = 11 [json_name="ShortInfs"];
  repeated DTAFNDFundShortDtl short_dtls = 12 [json_name="ShortDtls"];
  repeated DTAFNDFundAntiDilution anti_dils = 13 [json_name="AntiDils"];
  repeated DTAFNDFundMGTFeeInf mgt_fees = 14 [json_name="MgtFees"];
  repeated DTAFNDFundMGTFeeDtl mgt_fee_dtls = 15 [json_name="MgtFeeDtls"];
}

message SaveFundInfoResponse {
  bool success = 1 [json_name="Success"];
  string message = 2 [json_name="Message"];
  string return_code = 3 [json_name="ReturnCode"];
}

