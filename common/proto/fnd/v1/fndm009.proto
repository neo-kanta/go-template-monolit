syntax = "proto3";

package fnd.v1;
option go_package = "go-transfer-agent/common/gen/fnd/v1;fndv1";

import "google/api/annotations.proto";

// ═══════════════════════════════════════════════════════════════════
// FNDM009 Service
// ═══════════════════════════════════════════════════════════════════
service FNDM009Service {
  rpc TAFNDFavDisc(TAFNDFavDiscRequest) returns (TAFNDFavDiscResponse) {
    option (google.api.http) = { get: "/TAapi/Fund/TAFNDFavDisc" };
  }
}

// ═══════════════════════════════════════════════════════════════════
// FNDM009 Messages
// ═══════════════════════════════════════════════════════════════════

message TAFNDFavDiscRequest {
  string sys_co_id = 1 [json_name="SysCoID"];
  string cus_id_code = 2 [json_name="CusIDCode"];
  string disc_item_set = 3 [json_name="DiscItemSet"];
  string disc_fund_type = 4 [json_name="DiscFundType"];
  repeated FavDiscPrtFundListDTO prt_fund_list = 5 [json_name="PrtFundList"];
  repeated FavDiscTypeListDTO disc_type_list = 6 [json_name="DiscTypeList"];
  repeated FavDiscTypeDtlListDTO disc_type_dtl_list = 7 [json_name="DiscTypeDtlList"];
}

message TAFNDFavDiscResponse {
  repeated FavDiscMasterDTO result_list = 1 [json_name="ResultList"];
  repeated FavDiscPrtFundListDTO prt_fund_list = 2 [json_name="PrtFundList"];
  repeated FavDiscTypeDtlListDTO allot_disc_type_dtl_list = 3 [json_name="AllotDiscTypeDtlList"];
  repeated FavDiscTypeDtlListDTO rsp_disc_type_dtl_list = 4 [json_name="RspDiscTypeDtlList"];
  repeated FavDiscTypeDtlListDTO sw_disc_type_dtl_list = 5 [json_name="SwDiscTypeDtlList"];
}

message FavDiscMasterDTO {
  string sys_co_id = 1 [json_name="SysCoID"];
  string sys_co_id_nm = 2 [json_name="SysCoIDNm"];
  string cus_id_code = 3 [json_name="CusIDCode"];
  string cus_id_code_nm = 4 [json_name="CusIDCodeNm"];
  repeated string disc_item_set = 5 [json_name="DiscItemSet"];
  string disc_fund_type = 6 [json_name="DiscFundType"];
  string allot_disc_type = 7 [json_name="AllotDiscType"];
  string rsp_disc_type = 8 [json_name="RspDiscType"];
  string sw_disc_type = 9 [json_name="SwDiscType"];
}

message FavDiscPrtFundListDTO {
  string sys_co_id = 1 [json_name="SysCoID"];
  string cus_id_code = 2 [json_name="CusIDCode"];
  string prt_fund_code = 3 [json_name="PrtFundCode"];
  string prt_fund_code_nm = 4 [json_name="PrtFundCodeNm"];
}

message FavDiscTypeListDTO {
  string sys_co_id = 1 [json_name="SysCoID"];
  string cus_id_code = 2 [json_name="CusIDCode"];
  string disc_item = 3 [json_name="DiscItem"];
  string disc_type = 4 [json_name="DiscType"];
}

message FavDiscTypeDtlListDTO {
  string sys_co_id = 1 [json_name="SysCoID"];
  string cus_id_code = 2 [json_name="CusIDCode"];
  string disc_item = 3 [json_name="DiscItem"];
  string tx_cry = 4 [json_name="TxCry"];
  string tx_cry_nm = 5 [json_name="TxCryNm"];
  double range_amt_above = 6 [json_name="RangeAmtAbove"];
  double range_fee_rate = 7 [json_name="RangeFeeRate"];
}
