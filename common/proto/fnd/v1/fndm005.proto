syntax = "proto3";

package fnd.v1;
option go_package = "go-transfer-agent/common/gen/fnd/v1;fndv1";

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "fnd/v1/common.proto";

// ═══════════════════════════════════════════════════════════════════
// FNDM005 Service
// ═══════════════════════════════════════════════════════════════════
service FNDM005Service {
  rpc TAFNDFundCalDate(TAFNDFundCalDateRequest) returns (TAFNDFundCalDateResponse) {
    option (google.api.http) = { get: "/TAapi/BaseFund/TAFNDFundCalDate" };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: ["APIFNDM005：TAFNDFundCalDate"]
    };
  }

  rpc SaveTAFNDFundCalDate(TAFNDFundCalDateRequest) returns (SaveResponse) {
    option (google.api.http) = { post: "/TAapi/BaseFund/TAFNDFundCalDate" body: "*" };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: ["APIFNDM005：TAFNDFundCalDate"]
    };
  }

  rpc UpdateTAFNDFundCalDate(TAFNDFundCalDateRequest) returns (SaveResponse) {
    option (google.api.http) = { put: "/TAapi/BaseFund/TAFNDFundCalDate" body: "*" };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: ["APIFNDM005：TAFNDFundCalDate"]
    };
  }

  rpc DeleteTAFNDFundCalDate(DeleteRequest) returns (SaveResponse) {
    option (google.api.http) = { delete: "/TAapi/BaseFund/TAFNDFundCalDate" };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: ["APIFNDM005：TAFNDFundCalDate"]
    };
  }

  rpc TACKFNDCalEdit(TACKFNDCalEditRequest) returns (CheckResponse) {
    option (google.api.http) = { get: "/TAapi/BaseFund/TAFNDFundCalDate/ChkData/TACKFNDCalEdit" };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: ["APIFNDM005：TAFNDFundCalDate"]
    };
  }


  // GET Data by DataID (Maintain Query)
  rpc GetDataByDataID(GetDataRequest) returns (TAFNDFundCalDateRequest) {
    option (google.api.http) = { get: "/TAapi/BaseFund/TAFNDFundCalDate/GetData/{data_id}" };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: ["APIFNDM005：TAFNDFundCalDate"]
    };
  }

}
// ═══════════════════════════════════════════════════════════════════
// FNDM005 Messages
// ═══════════════════════════════════════════════════════════════════

message TAFNDFundCalDateRequest {
  string sys_co_id = 1 [json_name="SysCoID"];
  string cal_year = 2 [json_name="CalYear"];
  string fnd_cal_type = 3 [json_name="FndCalType"];
  string fund_cry = 4 [json_name="FundCry"];
  repeated FundClosedDateMemoListDTO fund_closed_memo_list = 5 [json_name="FundClosedMemoList"];
  repeated FundClosedDateFundListDTO fund_closed_date_fund_list = 6 [json_name="FundClosedDateFundList"];
}

message TAFNDFundCalDateResponse {
  repeated FundCalMasterDTO result_list = 1 [json_name="ResultList"];
  repeated FundClosedDateMemoListDTO fund_closed_memo_list = 2 [json_name="FundClosedMemoList"];
  repeated FundClosedDateFundListDTO fund_closed_date_fund_list = 3 [json_name="FundClosedDateFundList"];
}

message FundCalMasterDTO {
  string sys_co_id = 1 [json_name="SysCoID"];
  string sys_co_id_nm = 2 [json_name="SysCoIDNm"];
  string cal_year = 3 [json_name="CalYear"];
  string fnd_cal_type = 4 [json_name="FndCalType"];
  string fund_cry = 5 [json_name="FundCry"];
  string fund_cry_nm = 6 [json_name="FundCryNm"];
}

message FundClosedDateMemoListDTO {
  string sys_co_id = 1 [json_name="SysCoID"];
  string cal_year = 2 [json_name="CalYear"];
  string fnd_cal_type = 3 [json_name="FndCalType"];
  string fund_cry = 4 [json_name="FundCry"];
  string cal_date = 5 [json_name="CalDate"];
  string remark = 6 [json_name="Remark"];
}

message FundClosedDateFundListDTO {
  string sys_co_id = 1 [json_name="SysCoID"];
  string cal_year = 2 [json_name="CalYear"];
  string fnd_cal_type = 3 [json_name="FndCalType"];
  string fund_cry = 4 [json_name="FundCry"];
  string prt_fund_code = 5 [json_name="PrtFundCode"];
  string prt_fund_code_nm = 6 [json_name="PrtFundCodeNm"];
  string cal_date = 7 [json_name="CalDate"];
}

// KFNDM00502
message TACKFNDCalEditRequest {
  string sys_co_id = 1 [json_name="SysCoID"];
  string check_time_point = 2 [json_name="CheckTimePoint"];
}

message ApproveTAFNDFundCalDateRequest {
  string sys_co_id = 1 [json_name="SysCoID"];
  string data_id = 2 [json_name="DataID"];
  string checker_id = 3 [json_name="CheckerID"];
  bool is_approved = 4 [json_name="IsApproved"];
  string remark = 5 [json_name="Remark"];
}
